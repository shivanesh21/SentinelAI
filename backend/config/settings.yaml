# SentinelAI global settings
telemetry:
  collection_interval_sec: 30
  prediction_window_min: 10        # failure_in_next_Nmin label window
  feature_windows_min: [5, 10, 15] # rolling-window sizes for feature engineering

features:
  windows_min: [5, 10, 15]         # rolling-average windows per metric
  growth_window_min: 10            # lookback for *_growth_rate features
  error_window_min: 5              # window for Error_rate
  request_window_min: 5            # window for Request_rate
  min_periods: 1                   # 1 -> partial windows allowed during warm-up
  request_floor_rps: 1.0           # denominator floor for latency_per_request

labels:
  horizons_min: [10]               # failure_in_next_10min
  include_current_failure: true    # count the current tick if already failing
  include_time_to_failure: true    # auxiliary time_to_failure_min column

splits:
  train: 0.6
  val: 0.2
  test: 0.2
  purge_min: 10                    # embargo before each boundary (>= label horizon)

simulation:
  seed: 42
  duration_min: 720                # default generation window per run (12 h)
  schedule_repeats: 2              # tile the scenario schedule N times
  schedule_period_min: 720         # gap between tiles (12 h)
  scenario_schedule:
    - { service: payment-api,       type: memory_leak,                 start_min: 60,  duration_min: 120 }
    - { service: payment-api,       type: connection_pool_exhaustion,  start_min: 300, duration_min: 60  }
    - { service: order-service,     type: latency_spike,               start_min: 400, duration_min: 20  }
    - { service: notification-worker, type: network_partition,         start_min: 480, duration_min: 25  }
    - { service: inventory-service, type: disk_fill,                   start_min: 540, duration_min: 120 }

anomaly:
  contamination: 0.05
  levels: [NORMAL, WARNING, ANOMALOUS, CRITICAL]  # ascending score thresholds
  rolling_iqr_window_min: 60       # local fence window for the rolling-IQR baseline
  isolation_forest:
    n_estimators: 200
    random_state: 42
  autoencoder:
    hidden_dims: [32, 8]
    epochs: 50
    batch_size: 256
    learning_rate: 0.001
    seed: 42
    normal_only: true
    lstm_enabled: false           # also train the sequence autoencoder
    seq_len: 20                   # 10 minutes at 30 s resolution
    lstm_units: 32

risk:
  weights:                          # Module 5 multi-signal scoring
    failure_probability: 0.40
    anomaly_score: 0.25
    error_rate: 0.15
    latency_trend: 0.10
    memory_growth: 0.10
  signal_map:                       # percentile-normalized operational signals
    error_rate: Error_rate
    latency_trend: Latency_15min_avg
    memory_growth: Memory_growth_rate
  severity_thresholds:
    WARNING: 0.40
    ANOMALOUS: 0.65
    CRITICAL: 0.85

recovery:
  cooldown_sec: 60                  # wait after remediation before health re-check

models:
  baseline:
    logistic_regression: {}
    random_forest:
      n_estimators: 200
      max_depth: 12
      min_samples_split: 10
      min_samples_leaf: 4
  advanced:
    xgboost:
      tune: true
      tune_trials: 30
      tune_cv: 3
    lightgbm:
      tune: true
      tune_trials: 30
      tune_cv: 3
  sequential:
    lstm_classifier:
      seq_len: 20                  # 10 minutes at 30 s resolution
      lstm_units: 32
      dropout: 0.2
      learning_rate: 0.001
      epochs: 50
      batch_size: 128
      patience: 5
      seed: 42
    tune: true
    tune_space:
      - { seq_len: 20, lstm_units: 32, dropout: 0.2, learning_rate: 0.001, epochs: 40, batch_size: 128, patience: 5, seed: 42 }
      - { seq_len: 20, lstm_units: 64, dropout: 0.2, learning_rate: 0.001, epochs: 40, batch_size: 128, patience: 5, seed: 42 }
      - { seq_len: 20, lstm_units: 32, dropout: 0.1, learning_rate: 0.0005, epochs: 40, batch_size: 128, patience: 6, seed: 42 }
      - { seq_len: 30, lstm_units: 32, dropout: 0.2, learning_rate: 0.001, epochs: 40, batch_size: 128, patience: 5, seed: 42 }
      - { seq_len: 10, lstm_units: 32, dropout: 0.2, learning_rate: 0.001, epochs: 40, batch_size: 128, patience: 5, seed: 42 }
      - { seq_len: 20, lstm_units: 48, dropout: 0.3, learning_rate: 0.001, epochs: 40, batch_size: 64, patience: 6, seed: 42 }